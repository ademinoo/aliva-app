<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Splash</title>
  <style>
    body { margin: 0; padding: 0; background: red; }
  </style>
</head>
<body>

  <!-- SPLASH : aucun framework, CSS pur -->
  <div id="sp" style="
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%;
    z-index: 9999;
    background-color: #1e5c3a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  ">
    <p style="color:white; font-family:Georgia,serif; font-size:2rem; font-weight:300; margin:0;">
      Aliva
    </p>
    <p style="color:rgba(255,255,255,0.6); font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase; margin-top:12px;">
      TEST SPLASH — visible 8 secondes
    </p>
  </div>

  <!-- Contenu de la page (fond rouge = diagnostic) -->
  <div style="padding: 40px; color: white;">
    <h1>Page chargée</h1>
    <p>Si tu vois ce texte SANS avoir vu le vert, position:fixed ne fonctionne pas.</p>
    <p>Si tu as vu le vert 8 secondes, tout va bien côté CSS.</p>
  </div>

  <script>
    var el = document.getElementById('sp');
    setTimeout(function () {
      el.style.transition = 'opacity 0.8s ease';
      el.style.opacity = '0';
      setTimeout(function () { el.style.display = 'none'; }, 900);
    }, 8000);
  </script>

</body>
</html>
